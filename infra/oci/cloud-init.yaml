#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - unattended-upgrades

groups:
  - docker

users:
  - default

write_files:
  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": {
          "max-size": "10m",
          "max-file": "3"
        }
      }

  - path: /opt/assetmind/README.deploy
    owner: ubuntu:ubuntu
    permissions: "0644"
    content: |
      AssetMind deploy directory.
      Prefer syncing the full repo (see infra/oci/scripts/remote-up.sh).
      Then: ./infra/oci/scripts/deploy.sh
      Health: curl -fsS http://127.0.0.1/health

runcmd:
  - |
    if [ ! -f /swapfile ]; then
      fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
      chmod 600 /swapfile
      mkswap /swapfile
    fi
  - swapon /swapfile || true
  - grep -q '/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - |
    . /etc/os-release
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list
  - apt-get update
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - systemctl enable --now docker
  - usermod -aG docker ubuntu
  - mkdir -p /opt/assetmind
  - chown ubuntu:ubuntu /opt/assetmind
  - chmod 0755 /opt/assetmind

final_message: "AssetMind host bootstrap finished. Swap and Docker are ready; deploy compose under /opt/assetmind."

[project]
name = "assetmind"
version = "0.1.0"
description = "Open-source multi-agent financial analysis platform"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Douglas Morais", email = "mr.douglasmorais23@gmail.com" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "agno[openai,os,postgres]>=3.1.12,<3.2",
    "alembic>=1.14",
    "fastapi>=0.115",
    "groq>=0.31",
    "httpx>=0.28",
    "numpy>=2.1",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
assetmind = "assetmind.main:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
include = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=assetmind --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["src/assetmind"]
omit = [
    "src/assetmind/main.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]
